name: Deploy Telegram Mini App and Alert Worker

on:
  push:
    branches: ["مینی-اپ"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: telegram-mini-app-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate required configuration
        env:
          TGCLOUD_TOKEN: ${{ secrets.TGCLOUD_TOKEN }}
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          set -e
          for name in TGCLOUD_TOKEN CF_TOKEN CF_ACCOUNT TG_TOKEN; do
            if [ -z "${!name}" ]; then echo "::error::Missing GitHub secret/variable: $name"; exit 1; fi
          done

      - name: Install dependencies
        run: npm install

      - name: Configure Worker resources
        env:
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
          TGCLOUD_TOKEN: ${{ secrets.TGCLOUD_TOKEN }}
        working-directory: worker
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          path = Path("wrangler.toml")
          content = path.read_text()
          content = 'account_id = "' + os.environ["CF_ACCOUNT"] + '"\n' + content
          token = os.environ["TGCLOUD_TOKEN"]
          app_id = token.removeprefix("app").split(":", 1)[0]
          if not app_id.isdigit():
              raise SystemExit("Could not extract Telegram app ID from TGCLOUD_TOKEN")
          content = content.replace("APP_ID", app_id)
          path.write_text(content)
          PY

      - name: Deploy Alert Scheduler Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: worker
        run: npx wrangler deploy

      - name: Configure Worker secrets
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          printf '%s' "$TELEGRAM_BOT_TOKEN" | npx wrangler secret put TELEGRAM_BOT_TOKEN --config=worker/wrangler.toml

      - name: Build Mini App
        run: npm run build

      - name: Sync deployed Telegram Serverless revision
        env:
          TGCLOUD_TOKEN: ${{ secrets.TGCLOUD_TOKEN }}
        run: npx tgcloud fetch

      - name: Set Telegram Mini App URL
        env:
          TGCLOUD_TOKEN: ${{ secrets.TGCLOUD_TOKEN }}
        run: |
          APP_ID="${TGCLOUD_TOKEN#app}"
          APP_ID="${APP_ID%%:*}"
          if ! [[ "$APP_ID" =~ ^[0-9]+$ ]]; then
            echo "::error::Could not extract Telegram app ID from TGCLOUD_TOKEN."
            exit 1
          fi
          APP_ID="$APP_ID" python - <<'PY'
          import os
          from pathlib import Path
          path = Path("tgcloud/lib/config.js")
          path.write_text(path.read_text().replace("APP_ID", os.environ["APP_ID"]))
          PY
      - name: Deploy Mini App to Telegram Serverless
        env:
          TGCLOUD_TOKEN: ${{ secrets.TGCLOUD_TOKEN }}
        run: npx tgcloud push

      - name: Apply Telegram Serverless schema
        env:
          TGCLOUD_TOKEN: ${{ secrets.TGCLOUD_TOKEN }}
        run: npx tgcloud migrate --yes

      - name: Smoke test Telegram Serverless API and CRUD
        env:
          TGCLOUD_TOKEN: ${{ secrets.TGCLOUD_TOKEN }}
        run: |
          set -euo pipefail
          CTX="{ initData: { user: { id: ${GITHUB_RUN_ID}, first_name: \"CI\" } } }"
          npx tgcloud run endpoints/api '{"method":"POST","path":"/api/watchlist/","body":{"coin":"MINIAPP-CI-SMOKE"}}' --ctx "$CTX"
          LIST=$(npx tgcloud run endpoints/api '{"method":"GET","path":"/api/watchlist"}' --ctx "$CTX")
          echo "$LIST"
          [[ "$LIST" == *'MINIAPP-CI-SMOKE'* ]] || { echo "::error::Watchlist read endpoint failed"; exit 1; }
          npx tgcloud run endpoints/api "{\"method\":\"DELETE\",\"path\":\"/api/watchlist/1\"}" --ctx "$CTX"
          for SECTION in scenario positions strategies tasks; do
            npx tgcloud run endpoints/api "{\"method\":\"POST\",\"path\":\"/api/$SECTION/\",\"body\":{\"title\":\"MINIAPP-CI-$SECTION\",\"text\":\"smoke\"}}" --ctx "$CTX"
            LIST=$(npx tgcloud run endpoints/api "{\"method\":\"GET\",\"path\":\"/api/$SECTION\"}" --ctx "$CTX")
            echo "$LIST"
            [[ "$LIST" == *"MINIAPP-CI-$SECTION"* ]] || { echo "::error::$SECTION CRUD smoke test failed"; exit 1; }
            npx tgcloud run endpoints/api "{\"method\":\"DELETE\",\"path\":\"/api/$SECTION/1\"}" --ctx "$CTX"
          done
          npx tgcloud run endpoints/api '{"method":"POST","path":"/api/alerts/","body":{"coin":"BTC","direction":"long","entry":50000,"targets":[{"price":55000,"note":"CI target"}],"ch":["tg"]}}' --ctx "$CTX"
          ALERTS=$(npx tgcloud run endpoints/api '{"method":"GET","path":"/api/alerts","query":{"x":"2"}}' --ctx "$CTX")
          echo "$ALERTS"
          [[ "$ALERTS" == *'BTC'* ]] || { echo "::error::Alert create/read smoke test failed"; exit 1; }
          npx tgcloud run endpoints/api '{"method":"DELETE","path":"/api/alerts/1"}' --ctx "$CTX"
          npx tgcloud run endpoints/api '{"method":"POST","path":"/api/cats","body":{"name":"MINIAPP-CI-CAT"}}' --ctx "$CTX"
          CATS=$(npx tgcloud run endpoints/api '{"method":"GET","path":"/api/cats"}' --ctx "$CTX")
          [[ "$CATS" == *'MINIAPP-CI-CAT'* ]] || { echo "::error::Alert categories smoke test failed"; exit 1; }
          npx tgcloud run endpoints/api '{"method":"DELETE","path":"/api/cats/1"}' --ctx "$CTX"
          npx tgcloud run endpoints/api '{"method":"POST","path":"/api/tabs","body":{"title":"MINIAPP-CI-TAB"}}' --ctx "$CTX"
          TABS=$(npx tgcloud run endpoints/api '{"method":"GET","path":"/api/tabs"}' --ctx "$CTX")
          [[ "$TABS" == *'MINIAPP-CI-TAB'* ]] || { echo "::error::Custom tabs smoke test failed"; exit 1; }
          BACKUP=$(npx tgcloud run endpoints/api '{"method":"GET","path":"/api/backup"}' --ctx "$CTX")
          echo "$BACKUP"
          [[ "$BACKUP" == *'trade-panel-backup'* ]] || { echo "::error::Backup export failed"; exit 1; }
          npx tgcloud run endpoints/api '{"method":"POST","path":"/api/backup/import","body":{"format":"trade-panel-backup","version":1,"data":{"alerts":{"alerts":[],"last_id":0},"cats":[],"watchlist":{"items":[{"id":1,"coin":"BACKUP-CI-SMOKE","note":"","cat":0}],"last_id":1},"wcats":[],"scenario":{"items":[],"last_id":0},"scats":[],"positions":{"items":[],"last_id":0},"pcats":[],"strategies":{"items":[],"last_id":0},"gcats":[],"tasks":{"items":[],"last_id":0},"kcats":[],"tabs":{"tabs":[]},"settings":{"lang":"fa"}}}}' --ctx "$CTX"
          BACKUP_LIST=$(npx tgcloud run endpoints/api '{"method":"GET","path":"/api/watchlist"}' --ctx "$CTX")
          [[ "$BACKUP_LIST" == *'BACKUP-CI-SMOKE'* ]] || { echo "::error::Backup import did not restore data"; exit 1; }
          BACKUP_AFTER=$(npx tgcloud run endpoints/api '{"method":"GET","path":"/api/backup"}' --ctx "$CTX")
          [[ "$BACKUP_AFTER" == *'BACKUP-CI-SMOKE'* ]] || { echo "::error::Backup export after restore failed"; exit 1; }
          npx tgcloud run endpoints/api '{"method":"GET","path":"/api/settings"}' --ctx "$CTX"
          npx tgcloud run endpoints/api '{"method":"GET","path":"/api/status"}' --ctx "$CTX"
          npx tgcloud run endpoints/api '{"method":"POST","path":"/api/check-now"}' --ctx "$CTX"
          npx tgcloud run endpoints/cron "{\"userId\":${GITHUB_RUN_ID}}" --ctx '{ initData: { start_param: "worker-cron", user: { id: 1 } } }'
