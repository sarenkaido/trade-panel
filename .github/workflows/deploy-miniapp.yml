name: Deploy Telegram Mini App and Alert Worker

on:
  push:
    branches: ["مینی-اپ"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: telegram-mini-app-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Validate required configuration
        env:
          TGCLOUD_TOKEN: ${{ secrets.TGCLOUD_TOKEN }}
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          D1_ID: ${{ vars.D1_DATABASE_ID }}
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          WORKER_URL: ${{ vars.WORKER_API_URL }}
        run: |
          set -e
          for name in TGCLOUD_TOKEN CF_TOKEN CF_ACCOUNT D1_ID TG_TOKEN WORKER_URL; do
            if [ -z "${!name}" ]; then echo "::error::Missing GitHub secret/variable: $name"; exit 1; fi
          done
      - run: npm install
      - name: Set Worker configuration
        env:
          D1_ID: ${{ vars.D1_DATABASE_ID }}
          CF_ACCOUNT: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          sed -i "s/SET_D1_DATABASE_ID_IN_GITHUB_VARIABLES/$D1_ID/" worker/wrangler.toml
          printf '\naccount_id = "%s"\n' "$CF_ACCOUNT" >> worker/wrangler.toml
      - name: Deploy Alert Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          command: deploy
      - name: Apply D1 schema
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 execute telegram-mini-alerts --remote --file=worker/schema.sql --config=worker/wrangler.toml
      - name: Configure Worker secrets
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          printf '%s' "$TELEGRAM_BOT_TOKEN" | npx wrangler secret put TELEGRAM_BOT_TOKEN --config=worker/wrangler.toml
      - name: Build Mini App
        env:
          WORKER_API_URL: ${{ vars.WORKER_API_URL }}
        run: npm run build
      - name: Deploy Mini App to Telegram Serverless
        env:
          TGCLOUD_TOKEN: ${{ secrets.TGCLOUD_TOKEN }}
        run: npx tgcloud push
      - name: Apply Telegram Serverless schema
        env:
          TGCLOUD_TOKEN: ${{ secrets.TGCLOUD_TOKEN }}
        run: npx tgcloud migrate --yes
