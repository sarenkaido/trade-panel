name: Deploy Telegram Mini App and Alert Worker

on:
  push:
    branches: ["مینی-اپ"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: telegram-mini-app-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate required configuration
        env:
          TGCLOUD_TOKEN: ${{ secrets.TGCLOUD_TOKEN }}
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
          D1_ID: ${{ secrets.D1_DATABASE_ID || vars.D1_DATABASE_ID }}
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          set -e
          for name in TGCLOUD_TOKEN CF_TOKEN CF_ACCOUNT D1_ID TG_TOKEN; do
            if [ -z "${!name}" ]; then echo "::error::Missing GitHub secret/variable: $name"; exit 1; fi
          done

      - name: Install dependencies
        run: npm install

      - name: Configure Worker resources
        env:
          D1_ID: ${{ secrets.D1_DATABASE_ID || vars.D1_DATABASE_ID }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: worker
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          path = Path("wrangler.toml")
          content = path.read_text()
          content = content.replace("SET_D1_DATABASE_ID_IN_GITHUB_VARIABLES", os.environ["D1_ID"])
          content = 'account_id = "' + os.environ["CF_ACCOUNT"] + '"\n' + content
          path.write_text(content)
          PY

      - name: Deploy Alert Worker and capture URL
        id: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: worker
        run: |
          set -o pipefail
          npx wrangler deploy 2>&1 | tee /tmp/wrangler-deploy.log
          URL=$(grep -Eo 'https://[a-zA-Z0-9-]+\.workers\.dev' /tmp/wrangler-deploy.log | tail -n 1)
          if [ -z "$URL" ]; then
            echo "::error::Could not determine Worker URL from Wrangler output."
            exit 1
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Worker deployed: $URL"

      - name: Apply D1 schema
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 execute telegram-mini-alerts --remote --file=worker/schema.sql --config=worker/wrangler.toml

      - name: Configure Worker secrets
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          printf '%s' "$TELEGRAM_BOT_TOKEN" | npx wrangler secret put TELEGRAM_BOT_TOKEN --config=worker/wrangler.toml

      - name: Build Mini App
        env:
          WORKER_API_URL: ${{ steps.worker.outputs.url }}
        run: npm run build

      - name: Deploy Mini App to Telegram Serverless
        env:
          TGCLOUD_TOKEN: ${{ secrets.TGCLOUD_TOKEN }}
        run: npx tgcloud push

      - name: Apply Telegram Serverless schema
        env:
          TGCLOUD_TOKEN: ${{ secrets.TGCLOUD_TOKEN }}
        run: npx tgcloud migrate --yes
