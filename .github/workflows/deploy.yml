# هر بار که چیزی در شاخه‌ی clude پوش شود، ورکر «alert» خودکار روی Cloudflare دیپلوی می‌شود.
# Secrets لازم (GitHub ← Settings ← Secrets and variables ← Actions):
#   CLOUDFLARE_API_TOKEN ، CLOUDFLARE_ACCOUNT_ID ، KV_NAMESPACE_ID
# Secret اختیاری: D1_DATABASE_ID (اگر بگذاری، دیتابیس D1 هم وصل می‌شود)
name: Deploy to Cloudflare
on:
  push:
    branches: [clude]
    paths: ["worker.js", "wrangler.toml", ".github/workflows/deploy.yml"]
  workflow_dispatch: {}   # دکمه‌ی «Run workflow» برای دیپلوی دستی

permissions:
  contents: read   # کمترین دسترسی ممکن برای توکن خودکار گیت‌هاب

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check
        run: |
          cp worker.js /tmp/check.mjs
          node --check /tmp/check.mjs
      - name: Insert KV id
        env:
          KV_ID: ${{ secrets.KV_NAMESPACE_ID }}
        run: |
          if [ -z "$KV_ID" ]; then echo "::error::Secret KV_NAMESPACE_ID is missing (GitHub > Settings > Secrets and variables > Actions)"; exit 1; fi
          sed -i "s/PUT_YOUR_KV_NAMESPACE_ID_HERE/$KV_ID/" wrangler.toml
      - name: Attach D1 database (optional)
        env:
          D1_ID: ${{ secrets.D1_DATABASE_ID }}
        run: |
          if [ -n "$D1_ID" ]; then
            printf '\n[[d1_databases]]\nbinding = "DB"\ndatabase_name = "alert-db"\ndatabase_id = "%s"\n' "$D1_ID" >> wrangler.toml
            echo "D1 attached"
          else
            echo "D1_DATABASE_ID not set: using KV only"
          fi
      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
