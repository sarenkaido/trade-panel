# هر بار که چیزی در شاخه‌ی پیش‌فرض پوش شود، ورکر «alert» خودکار روی Cloudflare دیپلوی می‌شود.
# Secrets لازم (GitHub ← Settings ← Secrets and variables ← Actions):
#   CLOUDFLARE_API_TOKEN ، CLOUDFLARE_ACCOUNT_ID ، KV_NAMESPACE_ID ، D1_DATABASE_ID
name: Deploy to Cloudflare
on:
  push:
    branches: ["**"]   # فقط شاخه‌ی پیش‌فرض واقعاً دیپلوی می‌شود (شرط `if` پایین)
    paths: ["worker.js", "wrangler.toml", ".github/workflows/deploy.yml"]
  workflow_dispatch: {}   # دکمه‌ی «Run workflow» برای دیپلوی دستی

permissions:
  contents: read   # کمترین دسترسی ممکن برای توکن خودکار گیت‌هاب

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    # حتی اجرای دستی هم فقط از شاخه‌ی پیش‌فرض اجازه‌ی دیپلوی دارد
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check
        run: |
          cp worker.js /tmp/check.mjs
          node --check /tmp/check.mjs
      - name: Insert KV id
        env:
          KV_ID: ${{ secrets.KV_NAMESPACE_ID }}
        run: |
          if [ -z "$KV_ID" ]; then echo "::error::Secret KV_NAMESPACE_ID is missing (GitHub > Settings > Secrets and variables > Actions)"; exit 1; fi
          sed -i "s/PUT_YOUR_KV_NAMESPACE_ID_HERE/$KV_ID/" wrangler.toml
      - name: Attach D1 database (required)
        env:
          D1_ID: ${{ secrets.D1_DATABASE_ID }}
        run: |
          if [ -z "$D1_ID" ]; then
            echo "::error::Secret D1_DATABASE_ID is required. Create the alert-db D1 database and add its ID in GitHub Actions secrets."
            exit 1
          fi
          printf '\n[[d1_databases]]\nbinding = "DB"\ndatabase_name = "alert-db"\ndatabase_id = "%s"\n' "$D1_ID" >> wrangler.toml
          echo "D1 attached"
      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
